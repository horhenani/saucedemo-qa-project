[project]
name = "saucedemo-tests"
version = "0.1.0"
description = "Smoke tests for saucedemo.com using pytest + Playwright (system Chrome)"
requires-python = ">=3.14"
dependencies = [
    "pytest>=8",
    "playwright>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.40",
]
